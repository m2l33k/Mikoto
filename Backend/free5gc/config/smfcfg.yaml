info:
  version: 1.0.7
  description: SMF configuration
configuration:
  smfName: SMF
  sbi: { scheme: http, registerIPv4: smf, bindingIPv4: 0.0.0.0, port: 8080 }
  nrfUri: http://nrf:8080
  pfcp: { addr: smf }
  userplaneInformation:
    upNodes:
      UPF: { type: UPF, nodeID: upf }
  snssaiInfos:
    - sNssai: { sst: 1, sd: "010203" }
      dnnInfos:
        - dnn: internet
          dns: { ipv4: 8.8.8.8 }
