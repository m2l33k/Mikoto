info:
  version: 1.0.2
  description: NRF configuration
configuration:
  MongoDBName: free5gc
  MongoDBUrl: mongodb://mongodb:27017
  sbi:
    scheme: http          # mTLS is terminated by the Envoy sidecar
    registerIPv4: nrf
    bindingIPv4: 0.0.0.0
    port: 8080
  DefaultPlmnId:
    mcc: "208"
    mnc: "93"
