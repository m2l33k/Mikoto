# Hot-reload overrides for development (use with the base compose file):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up
# Mounts source and runs each Go service under `air` for live reload.
name: securecode5g

x-air: &air
  image: cosmtrek/air:latest
  working_dir: /app
  command: ["-c", ".air.toml"]

services:
  nrf-oauth2:
    <<: *air
    volumes: [../services/nrf-oauth2:/app]
  anomaly-detector:
    <<: *air
    volumes: [../services/anomaly-detector:/app]
  test-runner:
    <<: *air
    volumes: [../services/test-runner:/app, /var/run/docker.sock:/var/run/docker.sock]
  dashboard-api:
    <<: *air
    volumes: [../services/dashboard-api:/app]
