# Kubernetes stretch: ClusterIssuer backed by the Vault PKI engine.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: securecode5g-vault
spec:
  vault:
    server: http://vault.securecode5g.svc:8200
    path: pki/sign/nf
    auth:
      kubernetes:
        role: cert-manager
        mountPath: /v1/auth/kubernetes
        secretRef:
          name: cert-manager-vault-token
          key: token
