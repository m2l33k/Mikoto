id: TC-01
name: UE Initial Registration
category: standard
description: >
  A single UE performs initial registration (3GPP TS 23.502 §4.2.2.2) and
  reaches RM-REGISTERED. Verifies the AMF/AUSF/UDM call flow completes.
steps:
  - name: register-ue
    action: register-ue
    params:
      supi: "imsi-208930000000001"
      key: "8baf473f2f8fd09487cccbd7097c6862"
      opc: "8e27b6af0e692e750f32667a3b14605d"
    timing:
      maxDuration: 5s
    assertions:
      - type: nas-message
        target: registration-accept
        operator: contains
        expected: "5GMM-REGISTERED"
      - type: metric
        target: amf_registration_total
        operator: gt
        expected: "0"
